# ======================================
# COLLECTION SOURCE
# Use 'file' to load from local JSON
# Use 'postman' to fetch live from Postman API (no export needed!)
# ======================================
collectionSource=file

# Local collection path (used when collectionSource=file)
collection=./collection/new-collection.json

# Postman API settings (used when collectionSource=postman)
# Get your API key from: https://go.postman.co/settings/me/api-keys
postmanApiKey=YOUR_POSTMAN_API_KEY_HERE
postmanCollectionId=YOUR_COLLECTION_ID_HERE

# ======================================
# MAPPING TYPE: json or yaml
# ======================================
mappingType=json

# ======================================
# EVIDENCE FORMAT
# Options: docx | txt
# docx -> one page per iteration with full API details
# txt  -> all iterations in a single text file
# ======================================
evidenceFormat=docx

# ======================================
# COPY TEST DATA FILE TO REPORTS?
# Options: true | false
# When true, a copy of the data file (CSV/Excel) is placed in the report folder
# ======================================
copyTestDataToReports=true

# ======================================
# TEST CASE NAME COLUMN
# The column name in your data file that contains the test case name
# ======================================
testCaseNameColumn=testCaseName

# ======================================
# SSL SETTINGS
# ======================================
sslEnabled=false
sslCert=./certs/client-cert.pem
sslKey=./certs/client-key.pem
sslPassphrase=password123
